[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["solady/=lib/solady/src/", "@openzeppelin/=lib/openzeppelin-contracts/"]
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
